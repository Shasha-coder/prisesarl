<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Account Suspended</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #0f0f10; color: #f5f5f5;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
      main { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem;
        background: radial-gradient(ellipse at 50% 20%, #1a1a1f 0%, #0f0f10 55%, #0a0a0b 100%); }
      .card { max-width: 520px; width: 100%; text-align: center; border: 1px solid rgba(255,255,255,.08);
        border-radius: 12px; padding: 2.5rem 2rem; background: rgba(255,255,255,.03);
        box-shadow: 0 24px 80px rgba(0,0,0,.45); }
      .badge { width: 48px; height: 48px; margin: 0 auto 1.5rem; border-radius: 50%;
        border: 1px solid rgba(255,200,120,.35); display: flex; align-items: center; justify-content: center;
        color: #f0c674; font-size: 22px; font-weight: 600; }
      .kicker { margin: 0 0 .75rem; font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
        color: rgba(255,255,255,.45); font-weight: 600; }
      h1 { margin: 0 0 1rem; font-size: 1.35rem; line-height: 1.45; font-weight: 600; color: #f5f5f5; }
      p { margin: 0; font-size: .9rem; line-height: 1.6; color: rgba(255,255,255,.5); }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <div class="badge" aria-hidden="true">!</div>
        <p class="kicker">Service unavailable</p>
        <h1>The website has been temporarily suspended because the account has an outstanding balance.</h1>
        <p>Access will be restored once the outstanding balance is settled. Please contact the site administrator for payment details.</p>
      </div>
    </main>
  </body>
</html>
